<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>用户中心 · 图像设计工作台</title>
    <link rel="stylesheet" href="/shared/theme.css" />
    <script src="/shared/theme-init.js"></script>
  </head>
  <body>
    <div id="page">
      <div class="card profile-hero" style="margin-bottom: 22px">
        <div class="avatar-preview lg" id="avatarPreview">?</div>
        <div class="profile-hero-info">
          <div class="profile-hero-name" id="profileName">--</div>
          <div class="profile-hero-sub">
            <span class="tier-badge" id="profileTierBadge">--</span>
            <span id="profileTotal" class="card-desc" style="margin: 0"></span>
          </div>
          <div style="margin-top: 10px">
            <button class="btn sm" id="avatarBtn" type="button">更换头像</button>
            <input id="avatarInput" type="file" accept="image/png,image/jpeg,image/webp,image/gif" hidden />
          </div>
          <p class="msg" id="avatarMsg"></p>
        </div>
      </div>

      <div class="responsive-2col">
        <div>
          <div class="card" style="margin-bottom: 22px">
            <div class="card-title">邮箱</div>
            <div class="card-desc" style="margin-bottom: 16px">用于后续找回密码等场景，注册时至少填过邮箱或手机号一项。</div>
            <div class="contact-display" id="emailDisplay" hidden>
              <span class="contact-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
              </span>
              <span class="contact-display-value" id="emailValue"></span>
              <button class="btn sm ghost" id="emailEditBtn" type="button">修改</button>
            </div>
            <form id="emailForm" hidden>
              <label class="field"><span>邮箱</span>
                <input class="input" id="email" type="email" placeholder="name@example.com" />
              </label>
              <p class="msg" id="emailMsg"></p>
              <button class="btn primary full" id="emailBtn" type="submit">保存邮箱</button>
            </form>
          </div>

          <div class="card" style="margin-bottom: 22px">
            <div class="card-title">手机号</div>
            <div class="card-desc" style="margin-bottom: 16px">11 位手机号。</div>
            <div class="contact-display" id="phoneDisplay" hidden>
              <span class="contact-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
              </span>
              <span class="contact-display-value" id="phoneValue"></span>
              <button class="btn sm ghost" id="phoneEditBtn" type="button">修改</button>
            </div>
            <form id="phoneForm" hidden>
              <label class="field"><span>手机号</span>
                <input class="input" id="phone" type="tel" placeholder="11 位手机号" />
              </label>
              <p class="msg" id="phoneMsg"></p>
              <button class="btn primary full" id="phoneBtn" type="submit">保存手机号</button>
            </form>
          </div>

          <div class="card">
            <div class="card-title">修改密码</div>
            <div class="card-desc" style="margin-bottom: 16px">定期更换密码更安全。</div>
            <form id="pwdForm">
              <label class="field"><span>原密码</span>
                <input class="input" id="oldPwd" type="password" autocomplete="current-password" />
              </label>
              <label class="field"><span>新密码</span>
                <input class="input" id="newPwd" type="password" autocomplete="new-password" placeholder="6-64 位" />
              </label>
              <label class="field"><span>确认新密码</span>
                <input class="input" id="newPwd2" type="password" autocomplete="new-password" />
              </label>
              <p class="msg" id="pwdMsg"></p>
              <button class="btn primary full" id="pwdBtn" type="submit">保存新密码</button>
            </form>
          </div>
        </div>

        <div class="card vip-card">
          <div class="section-label">成长等级</div>
          <div class="card-title" style="margin-bottom: 4px">VIP 权益</div>
          <div class="card-desc" style="margin-bottom: 18px">
            累计生成张数达到对应门槛即解锁更高档位与专属单价，用于展示成长权益；当前生成仍按 1 积分 = 1 张计费，不受等级影响。
          </div>

          <div class="vip-progress-wrap">
            <div class="vip-progress-labels">
              <span id="vipCurrentLabel">--</span>
              <span id="vipNextLabel" class="card-desc" style="margin: 0"></span>
            </div>
            <div class="vip-progress-track">
              <div class="vip-progress-fill" id="vipProgressFill"></div>
            </div>
          </div>

          <table class="table vip-table" id="vipTable">
            <thead>
              <tr>
                <th>等级</th>
                <th>单价</th>
                <th>达成状态</th>
              </tr>
            </thead>
            <tbody id="vipTableBody">
              <tr><td colspan="3"><div class="empty">加载中…</div></td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
    <script type="module" src="/pages/user-center/user-center.js"></script>
  </body>
</html>
