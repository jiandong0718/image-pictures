<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>音频创作 · AI 图像设计工作台</title><script src="/shared/theme-init.js?v=mystic-default-1"></script><link rel="stylesheet" href="/shared/theme.css" /><link rel="stylesheet" href="/shared/creative.css" /></head>
<body><div id="page" class="creative-page">
  <div class="creative-heading"><div><h2>让文字，有自己的声音</h2><p>为产品介绍、视频旁白和日常灵感生成语音。</p></div><a class="btn" href="/assets?kind=audio">查看音频素材</a></div>
  <nav class="creative-tabs" aria-label="创作类型"><a href="/workbench">图片创作</a><a href="/video">视频创作</a><a href="/audio" aria-current="page">音频创作</a></nav>
  <div class="creative-two-column"><div class="creative-stack"><section class="creative-panel"><div class="creative-heading"><h3>朗读文本</h3><button class="btn sm" id="pickText" type="button">引用文本素材</button></div>
    <form id="audioForm"><label class="field"><span>需要朗读的文字</span><textarea class="textarea creative-prompt" id="prompt" name="prompt" rows="9" maxlength="4096" required placeholder="写下你希望听见的文字…"></textarea></label><div class="creative-row"><span class="creative-meta" id="characterCount">0 字符</span><span class="creative-meta" id="costEstimate">正在读取计费规则…</span></div><label class="field"><span>声音指导（可选）</span><textarea class="textarea" id="instructions" name="instructions" rows="3" maxlength="2000" placeholder="例如：自然温柔的中文旁白，句末稍作停顿。是否支持由当前模型决定。"></textarea></label>
    <div class="creative-form-grid"><label class="field"><span>音色</span><input class="input" name="voice" id="voice" list="voices" value="alloy" maxlength="100" pattern="[a-zA-Z0-9_-]+" required /><datalist id="voices"><option value="alloy"></option><option value="ash"></option><option value="ballad"></option><option value="coral"></option><option value="echo"></option><option value="fable"></option><option value="nova"></option><option value="onyx"></option><option value="sage"></option><option value="shimmer"></option></datalist></label><label class="field"><span>输出格式</span><select class="select" name="format" id="format"><option value="mp3">MP3</option><option value="wav">WAV</option><option value="opus">Opus</option><option value="aac">AAC</option><option value="flac">FLAC</option></select></label><label class="field"><span>语速</span><select class="select" name="speed" id="speed"><option value="0.75">0.75 倍</option><option value="1" selected>1 倍 · 标准</option><option value="1.25">1.25 倍</option><option value="1.5">1.5 倍</option><option value="2">2 倍</option></select></label></div>
    <p class="creative-note" id="configHint">正在加载音频服务配置…</p><p class="creative-status" id="status" role="status" aria-live="polite"></p><div class="creative-actions"><button class="btn primary" id="generate" type="submit" disabled>生成音频</button><button class="btn" id="resumeTask" type="button" hidden>查询上次任务</button><button class="btn" id="recoverTask" type="button" hidden>核对中断任务</button><button class="btn" id="clearTask" type="button" hidden>清除失效本地关联</button></div></form>
  </section><details class="creative-panel" id="adminConfig" hidden><summary>音频服务配置 · 管理员</summary><p class="creative-note">配置兼容语音生成协议的服务。密钥留空会保留已保存密钥。</p><form id="configForm"><label class="field"><span>API 地址</span><input class="input" name="apiBase" type="url" placeholder="https://api.example.com/v1" required /></label><label class="field"><span>API Key</span><input class="input" name="apiKey" type="password" autocomplete="new-password" placeholder="留空保留原密钥" /></label><label class="field"><span>语音模型</span><input class="input" name="model" required placeholder="填写服务提供的模型名称" /></label><div class="creative-form-grid"><label class="field"><span>每档字符数</span><input class="input" name="charactersPerCredit" type="number" min="1" max="100000" step="1" value="1000" required /></label><label class="field"><span>每档积分</span><input class="input" name="creditsPerUnit" type="number" min="1" max="100000" step="1" value="1" required /></label></div><p class="creative-note">按去除首尾空白后的字符数向上取整计费。例如每 1000 字符 1 积分，1001 字符为 2 积分。</p><p class="creative-status" id="configStatus" role="status"></p><button class="btn" type="submit">保存音频配置</button></form></details></div>
  <section class="creative-panel"><div class="creative-heading"><h3>我的音频</h3><button class="btn sm" id="refreshAudio" type="button">刷新</button></div><p class="creative-status" id="historyStatus" role="status"></p><div class="creative-audio-list" id="audioList"></div><div class="creative-pagination"><button class="btn sm" id="previousAudio" type="button" disabled>上一页</button><span id="audioPageLabel"></span><button class="btn sm" id="nextAudio" type="button" disabled>下一页</button></div></section></div>
</div><script type="module" src="/pages/audio/audio.js"></script></body></html>
