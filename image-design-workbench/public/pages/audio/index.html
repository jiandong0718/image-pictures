<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>音频创作 · AI 图像设计工作台</title><script src="/shared/theme-init.js?v=mystic-default-1"></script><link rel="stylesheet" href="/shared/theme.css" /><link rel="stylesheet" href="/shared/creative.css" /><link rel="stylesheet" href="/pages/audio/audio.css" /></head>
<body><div id="page" class="creative-page audio-workspace">
  <header class="creative-heading"><div><h2>语音工作室</h2><p>输入文字，选择声音，生成可下载的音频。</p></div><div class="creative-actions"><a class="btn sm" id="audioSettingsLink" href="/config?category=audio" hidden>服务设置</a><a class="btn sm" href="/assets?kind=audio">音频素材</a></div></header>
  <nav class="creative-tabs" aria-label="创作类型"><a href="/workbench">图片创作</a><a href="/video">视频创作</a><a href="/audio" aria-current="page">音频创作</a></nav>
  <form id="audioForm" class="audio-compose">
    <section class="creative-panel audio-editor">
      <div class="creative-heading"><h3>朗读内容</h3><button class="btn sm" id="pickText" type="button">引用文本素材</button></div>
      <label class="field"><span class="audio-field-label">需要朗读的文字</span><textarea class="textarea creative-prompt" id="prompt" name="prompt" rows="12" maxlength="4096" required placeholder="在这里写下旁白、产品介绍，或一段想听见的文字…"></textarea></label>
      <div class="audio-count-row"><span id="characterCount">0 字符</span><span>最多 4096 字符</span></div>
      <details class="audio-instructions"><summary>声音指导（可选）</summary><label class="field"><span>语气与停顿</span><textarea class="textarea" id="instructions" name="instructions" rows="3" maxlength="2000" placeholder="例如：自然温柔的中文旁白，句末稍作停顿。是否支持由当前模型决定。"></textarea></label></details>
    </section>
    <aside class="creative-panel audio-controls">
      <h3>声音设置</h3>
      <label class="field"><span>语音服务</span><select class="select" id="audioService" name="endpointId"><option value="">默认服务</option></select></label>
      <label class="field"><span>音色</span><input class="input" name="voice" id="voice" list="voices" value="alloy" maxlength="100" pattern="[a-zA-Z0-9_-]+" required /><datalist id="voices"><option value="alloy"></option><option value="ash"></option><option value="ballad"></option><option value="coral"></option><option value="echo"></option><option value="fable"></option><option value="nova"></option><option value="onyx"></option><option value="sage"></option><option value="shimmer"></option></datalist></label>
      <label class="field"><span>语速</span><select class="select" name="speed" id="speed"><option value="0.75">0.75 倍 · 舒缓</option><option value="1" selected>1 倍 · 标准</option><option value="1.25">1.25 倍</option><option value="1.5">1.5 倍</option><option value="2">2 倍</option></select></label>
      <label class="field"><span>输出格式</span><select class="select" name="format" id="format"><option value="mp3">MP3</option><option value="wav">WAV</option><option value="opus">Opus</option><option value="aac">AAC</option><option value="flac">FLAC</option></select></label>
      <p class="creative-note" id="configHint">正在读取可用语音服务…</p>
      <div class="audio-submit"><p class="audio-cost" id="costEstimate">正在读取计费规则…</p><p class="creative-status" id="status" role="status" aria-live="polite"></p><button class="btn primary full" id="generate" type="submit" disabled>生成音频</button><div class="creative-actions"><button class="btn sm" id="resumeTask" type="button" hidden>查询上次任务</button><button class="btn sm" id="recoverTask" type="button" hidden>核对中断任务</button><button class="btn sm" id="clearTask" type="button" hidden>清除失效本地关联</button></div></div>
    </aside>
  </form>
  <section class="creative-panel audio-history"><div class="creative-heading"><div><h3>我的音频</h3><p>生成记录与下载</p></div><button class="btn sm" id="refreshAudio" type="button">刷新</button></div><p class="creative-status" id="historyStatus" role="status"></p><div class="creative-audio-list" id="audioList"></div><div class="creative-pagination"><button class="btn sm" id="previousAudio" type="button" disabled>上一页</button><span id="audioPageLabel"></span><button class="btn sm" id="nextAudio" type="button" disabled>下一页</button></div></section>
</div><script type="module" src="/pages/audio/audio.js?v=service-selection-1"></script></body></html>
