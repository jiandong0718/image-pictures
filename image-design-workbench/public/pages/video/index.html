<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI 生视频 · AI 图像设计工作台</title>
    <link rel="stylesheet" href="/shared/theme.css" />
    <script src="/shared/theme-init.js?v=mystic-default-1"></script>
    <link rel="stylesheet" href="/pages/video/video.css" />
  </head>
  <body>
    <div id="page">
      <div class="vid-studio">
        <!-- 中间画布：模式切换 + 提示词 + 结果 -->
        <div class="card vid-canvas">
          <div class="vid-canvas-head">
            <div>
              <div class="section-label">AI 生视频</div>
              <div class="card-title" id="modeTitle">文生视频</div>
            </div>
            <span class="badge" id="canvasBadge">就绪</span>
          </div>

          <div class="vid-modes" id="modes">
            <button type="button" class="vid-mode active" data-mode="text">文生视频</button>
            <button type="button" class="vid-mode" data-mode="image">图生视频</button>
          </div>

          <!-- 图生视频：源图上传（仅图生模式显示） -->
          <div class="vid-source" id="sourceBlock" hidden>
            <div class="section-label">源图 <span class="vid-source-count" id="sourceCount"></span></div>
            <input type="file" id="sourceInput" accept="image/png,image/jpeg,image/webp,image/gif" multiple hidden />
            <div class="vid-source-grid" id="sourceGrid"></div>
            <div id="videoFrameUrls" hidden>
              <label class="field"><span>首帧图片 HTTPS 地址</span><input class="input" type="url" id="videoFirstFrame" placeholder="https://example.com/first.png" /></label>
              <label class="field"><span>尾帧图片 HTTPS 地址（选填）</span><input class="input" type="url" id="videoLastFrame" placeholder="https://example.com/last.png" /></label>
            </div>
            <div class="vid-source-tip" id="sourceTip">参考图数量取决于所选模型。</div>
          </div>

          <div class="vid-stage" id="stage"></div>

          <div class="vid-recent" id="recentBlock" hidden>
            <div class="section-label">最近生成</div>
            <div class="vid-recent-grid" id="recentGrid"></div>
          </div>
        </div>

        <!-- 右侧：控制面板 -->
        <div class="card vid-panel">
          <div class="vid-panel-scroll">
            <label class="field"><span>视频服务</span><select class="select" id="videoService"><option value="">默认服务</option></select></label>
            <label class="field vid-prompt-field">
              <span>提示词</span>
              <textarea class="textarea" id="prompt" rows="4" placeholder="描述画面内容与镜头运动：主体、动作、环境、光线、运镜…"></textarea>
            </label>
            <details class="vid-inspirations"><summary>商品视频提示词灵感</summary><p>选择一条追加到提示词，可继续编辑；图生视频需上传商品图。</p><div id="videoInspirations" class="vid-inspiration-list"></div><p>中文提示词按商品创作场景改写，参考 <a href="https://github.com/yasuomang/ai-video-prompt-cookbook" target="_blank" rel="noopener noreferrer">AI Video Prompt Cookbook</a>、<a href="https://github.com/cliprise/awesome-ai-product-video-prompts" target="_blank" rel="noopener noreferrer">产品视频提示词库</a>及 <a href="https://github.com/Tencent-Hunyuan/HunyuanVideo-1.5/blob/main/assets/HunyuanVideo_1_5_Prompt_Handbook_EN.md" target="_blank" rel="noopener noreferrer">混元视频运镜指南</a>。</p></details>

            <div class="section-label" style="margin-top: 18px">画面比例</div>
            <div class="vid-chips" id="ratios"></div>

            <div id="videoQualityField"><div class="section-label" style="margin-top: 18px">清晰度</div><div class="vid-chips" id="qualities"></div></div>
            <div id="videoDurationField"><div class="section-label" style="margin-top: 18px">时长</div><div class="vid-chips" id="durations"></div></div>
            <p class="vid-note" id="videoCapabilityHint">参数根据所选模型调整。</p>

            <details class="vid-advanced" id="videoAdvanced">
              <summary>高级参数<span class="vid-adv-hint">（可选）</span></summary>
              <div class="vid-advanced-body">
                <label class="field" id="negativeField">
                  <span>负向提示词</span>
                  <textarea class="textarea" id="negative" rows="2" placeholder="要规避的内容，如：模糊、畸变、文字水印"></textarea>
                </label>
                <div class="field-grid-2">
                  <label class="field" id="seedField">
                    <span>种子（seed）</span>
                    <input class="input" id="seed" type="number" step="1" placeholder="留空随机" />
                  </label>
                  <label class="field" id="stepsField">
                    <span>推理步数</span>
                    <input class="input" id="steps" type="number" step="1" min="1" placeholder="默认" />
                  </label>
                </div>
              </div>
            </details>

            <p class="vid-note">是否生成声音由所选模型与服务决定，实际输出请以生成结果为准。</p>
          </div>

          <div class="vid-panel-foot">
            <p class="msg" id="msg"></p>
            <button class="btn primary full" id="generateBtn" type="button">生成视频</button>
            <button class="btn full" id="resumeVideoTask" type="button" hidden>查询上次任务</button>
            <button class="btn full" id="unlinkVideoTask" type="button" hidden>解除本地任务关联</button>
            <p class="card-desc" id="configHint" style="margin-top: 10px"></p>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/pages/video/video.js?v=layout-rollback-1"></script>
  </body>
</html>
