<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>登录 · 图像设计工作台</title>
    <link rel="stylesheet" href="/shared/theme.css" />
    <link rel="stylesheet" href="/pages/login/login.css" />
    <script src="/shared/theme-init.js"></script>
  </head>
  <body>
    <div class="auth-bg" aria-hidden="true">
      <span class="mist mist-1"></span>
      <span class="mist mist-2"></span>
      <span class="crane crane-1">
        <svg viewBox="0 0 64 22"><path d="M2,16 Q16,3 32,15 Q48,3 62,16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" /></svg>
      </span>
      <span class="crane crane-2">
        <svg viewBox="0 0 64 22"><path d="M2,16 Q16,3 32,15 Q48,3 62,16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" /></svg>
      </span>
    </div>

    <header class="auth-brand">
      <div class="brand-mark"></div>
      <div>
        <div class="brand-name">图像设计工作台</div>
        <div class="brand-sub">Image Studio</div>
      </div>
    </header>

    <div class="auth-shell">
      <main class="auth-card">
        <div class="section-label" id="formLabel">账户登录</div>
        <h2 class="card-title" id="formTitle" style="margin-bottom: 22px">欢迎回来</h2>

        <form id="authForm">
          <label class="field">
            <span>用户名</span>
            <input class="input" id="username" autocomplete="username" placeholder="2-32 位字母、数字、下划线或中文" />
          </label>
          <label class="field">
            <span>密码</span>
            <input class="input" id="password" type="password" autocomplete="current-password" placeholder="至少 6 位" />
          </label>
          <div id="contactFields" hidden>
            <label class="field">
              <span>邮箱</span>
              <input class="input" id="regEmail" type="email" autocomplete="email" placeholder="name@example.com" />
            </label>
            <label class="field">
              <span>手机号</span>
              <input class="input" id="regPhone" type="tel" autocomplete="tel" placeholder="11 位手机号" />
            </label>
            <p class="card-desc" style="margin: -10px 0 16px">邮箱、手机号至少填一项，用于后续联系与找回账户。</p>
          </div>
          <p class="msg" id="authMsg"></p>
          <button class="btn primary full" id="submitBtn" type="submit">登录</button>
        </form>

        <p style="margin-top: 18px; font-size: 13px; color: var(--ink-soft); text-align: center">
          <span id="switchHint">还没有账户？</span>
          <a href="#" id="switchMode" style="font-weight: 600">立即注册</a>
        </p>
        <p style="margin-top: 10px; font-size: 12px; color: var(--ink-mute); text-align: center">
          新用户注册即赠送 <strong style="color: var(--accent)">20</strong> 积分
        </p>
      </main>
    </div>
    <script type="module" src="/pages/login/login.js"></script>
  </body>
</html>
