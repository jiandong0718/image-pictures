<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>配置中心 · 图像设计工作台</title>
    <link rel="stylesheet" href="/shared/theme.css" />
    <link rel="stylesheet" href="/pages/config/config.css" />
  </head>
  <body>
    <div id="page">
      <div class="config-layout">
        <div class="config-row">
          <form class="card" id="imageForm">
            <div class="config-head-row">
              <div class="section-label">生图配置</div>
              <span class="badge" id="imageStatus">未配置</span>
            </div>
            <div class="card-title">画图 API Key</div>
            <div class="card-desc" style="margin-bottom: 16px">生图 API 地址由服务端固定，页面只填 Key。保存仅存于服务进程内存。</div>
            <label class="field">
              <span>生图 API Key</span>
              <input class="input" id="apiKey" type="password" autocomplete="off" placeholder="sk-..." />
            </label>
            <p class="card-desc" style="margin-bottom: 16px">画图消耗积分：1 积分 = 1 元 = 1 张图。保存 Key 后即可在各工作台生成图片。</p>
            <p class="msg" id="imageMsg"></p>
            <button class="btn primary full" id="saveImage" type="submit">保存生图配置</button>
          </form>

          <form class="card" id="promptForm">
            <div class="config-head-row">
              <div class="section-label">提示词提取配置</div>
              <span class="badge" id="promptStatus">未配置</span>
            </div>
            <div class="card-title">视觉理解 API</div>
            <div class="card-desc" style="margin-bottom: 16px">用于从参考图反推中文提示词，建议使用支持视觉的 GPT 兼容接口。</div>
            <label class="field">
              <span>提示词 API URL</span>
              <input class="input" id="promptUrl" type="url" autocomplete="off" placeholder="https://api.example.com/v1" />
            </label>
            <label class="field">
              <span>提示词 API Key</span>
              <input class="input" id="promptKey" type="password" autocomplete="off" />
            </label>
            <label class="field">
              <span>提示词模型</span>
              <input class="input" id="promptModel" type="text" autocomplete="off" placeholder="gpt-4o-mini" />
            </label>
            <p class="msg" id="promptMsg"></p>
            <button class="btn primary full" id="savePrompt" type="submit">保存提示词配置</button>
          </form>
        </div>

        <div class="card config-danger">
          <div class="config-danger-inner">
            <div class="copy">
              <div class="section-label" style="color: var(--danger)">危险操作</div>
              <div class="card-title">重置生成缓存</div>
              <div class="card-desc">删除所有已生成图片文件，套图编号从 001 重新开始。不影响账户和积分。</div>
              <p class="msg" id="resetMsg"></p>
            </div>
            <button class="btn danger" id="resetCache" type="button">重置生成缓存</button>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/pages/config/config.js"></script>
  </body>
</html>
