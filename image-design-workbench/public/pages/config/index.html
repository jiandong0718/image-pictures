<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>配置中心 · AI 图像设计工作台</title>
<link rel="stylesheet" href="/shared/theme.css" /><script src="/shared/theme-init.js?v=mystic-default-1"></script>
<link rel="stylesheet" href="/pages/config/config.css?v=global-default-10" />
</head>
<body class="settings-surface">
<div id="page">
  <div class="settings-page">
    <header class="settings-header"><div><h2>模型服务</h2><p>按用途管理已接入的服务，配置在各创作模块中共享。</p></div><button class="btn primary" id="addService" type="button">＋ 添加服务</button></header>
    <nav class="settings-tabs" aria-label="服务类别">
      <button type="button" data-category="images" aria-pressed="true">图像生成 <span id="countImages">—</span></button>
      <button type="button" data-category="prompt" aria-pressed="false">视觉理解 <span id="countPrompt">—</span></button>
      <button type="button" data-category="video" aria-pressed="false">视频生成 <span id="countVideo">—</span></button>
      <button type="button" data-category="audio" aria-pressed="false">语音生成 <span id="countAudio">—</span></button>
      <button type="button" data-category="maintenance" aria-pressed="false">维护</button>
    </nav>
    <section class="settings-body">
      <div class="list-toolbar"><p id="categoryDescription">正在读取服务配置…</p><label id="scheduleField" title="未设全局默认或默认节点停用时使用"><span>回退调度</span><select class="select" id="schedule"><option value="round_robin">轮询</option><option value="random">随机</option></select></label></div>
      <p class="settings-message" id="pageMessage" role="status" aria-live="polite"></p>
      <div class="provider-list" id="providerList" aria-busy="true"></div>
      <section class="maintenance-panel" id="maintenancePanel" hidden><h3>清理我的生成缓存</h3><p>清理当前账户的生成图片文件，并重新分配套图编号。此操作无法撤销。</p><button class="btn danger" id="resetCache" type="button">清理缓存</button></section>
    </section>
    <footer class="settings-footer">API 密钥仅在服务端使用，列表不会显示完整密钥。</footer>
  </div>
  <dialog class="settings-dialog" id="serviceDialog" aria-labelledby="dialogTitle">
    <header class="dialog-header"><div><h3 id="dialogTitle">添加服务</h3><p id="dialogDescription"></p></div><button class="icon-button" id="closeDialog" type="button" aria-label="关闭">×</button></header>
    <form id="serviceForm">
      <div class="dialog-fields">
        <label class="field" id="labelField"><span>服务名称</span><input class="input" id="serviceLabel" placeholder="例如：主服务" maxlength="100" /></label>
        <label class="field" id="videoProtocolField" hidden><span>视频接口协议</span><select class="select" id="videoProtocol"><option value="agnes">Agnes 兼容渠道</option><option value="wan3">阿里云百炼 · 万相 3.0</option><option value="wan26">阿里云百炼 · 万相 2.6</option><option value="minimax_h3">MiniMax · H3 官方</option><option value="grsai_veo">Grsai · Veo 3.1</option></select><small>请选择实际服务的接口协议，不同渠道不能只靠模型名互换。</small></label>
        <label class="field" id="urlField"><span>API 地址</span><input class="input" id="serviceUrl" type="url" placeholder="https://api.example.com/v1" autocomplete="off" /></label>
        <label class="field"><span>API Key</span><input class="input" id="serviceKey" type="password" autocomplete="new-password" /><small id="keyHint">仅用于连接当前服务。</small></label>
        <div class="field" id="modelField"><div class="field-heading"><label for="serviceModel">默认模型</label><button class="text-button" id="fetchModels" type="button">拉取模型</button></div><select class="select" id="serviceModel"><option value="">请先拉取模型</option></select><small id="modelHint">从 API 获取模型列表后选择。模型能力以服务商说明为准。</small></div>
        <label class="field" id="videoModelField" hidden><span>或手动填写模型</span><input class="input" id="videoModel" maxlength="100" placeholder="填写该服务支持的模型名" /><small>手动填写优先；具体模型能力以服务商支持为准。</small></label>
        <div class="audio-pricing" id="audioPricing" hidden><label class="field"><span>每档字符数</span><input class="input" type="number" min="1" max="100000" id="charactersPerCredit" value="1000" /></label><label class="field"><span>每档积分</span><input class="input" type="number" min="1" max="100000" id="creditsPerUnit" value="1" /></label></div>
        <label class="field" id="videoPricing" hidden><span>站内每秒积分</span><input class="input" type="number" min="1" max="100000" id="videoCredits" placeholder="留空使用全局默认" /><small>站内积分由管理员配置，供应商实际费用请在其平台确认。</small></label>
        <p class="settings-message" id="formMessage" role="status" aria-live="polite"></p>
      </div>
      <footer class="dialog-actions"><button class="btn" id="cancelDialog" type="button">取消</button><button class="btn primary" id="saveService" type="submit">保存服务</button></footer>
    </form>
  </dialog>
</div>
<script type="module" src="/pages/config/config.js?v=video-providers-1"></script>
</body>
</html>
