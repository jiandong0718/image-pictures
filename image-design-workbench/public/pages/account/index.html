<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>我的积分 · 图像设计工作台</title>
    <link rel="stylesheet" href="/shared/theme.css" />
    <script src="/shared/theme-init.js"></script>
  </head>
  <body>
    <div id="page">
      <div class="stat-grid" style="margin-bottom: 22px">
        <div class="card">
          <div class="section-label">当前余额</div>
          <div style="font-size: 38px; font-weight: 800" class="mono" id="balance">--</div>
          <div class="card-desc">1 积分 = 1 元 = 1 张图</div>
        </div>
        <div class="card">
          <div class="section-label">累计消费</div>
          <div style="font-size: 38px; font-weight: 800" class="mono" id="spent">--</div>
          <div class="card-desc">已用于生成图片的积分</div>
        </div>
        <div class="card">
          <div class="section-label">累计获得</div>
          <div style="font-size: 38px; font-weight: 800" class="mono" id="earned">--</div>
          <div class="card-desc">注册赠送 + 管理员充值</div>
        </div>
      </div>

      <div class="card">
        <div class="card-title">积分流水</div>
        <div class="card-desc" style="margin-bottom: 14px">最近 50 条记录</div>
        <div class="table-scroll">
          <table class="table">
            <thead>
              <tr>
                <th>时间</th>
                <th>类型</th>
                <th>说明</th>
                <th style="text-align: right">变动</th>
                <th style="text-align: right">余额</th>
              </tr>
            </thead>
            <tbody id="txBody">
              <tr><td colspan="5"><div class="empty">加载中…</div></td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <div class="card" style="margin-top: 22px; max-width: 460px">
        <div class="card-title">修改密码</div>
        <div class="card-desc" style="margin-bottom: 16px">定期更换密码更安全。</div>
        <form id="pwdForm">
          <label class="field"><span>原密码</span>
            <input class="input" id="oldPwd" type="password" autocomplete="current-password" />
          </label>
          <label class="field"><span>新密码</span>
            <input class="input" id="newPwd" type="password" autocomplete="new-password" placeholder="6-64 位" />
          </label>
          <label class="field"><span>确认新密码</span>
            <input class="input" id="newPwd2" type="password" autocomplete="new-password" />
          </label>
          <p class="msg" id="pwdMsg"></p>
          <button class="btn primary full" id="pwdBtn" type="submit">保存新密码</button>
        </form>
      </div>
    </div>
    <script type="module" src="/pages/account/account.js"></script>
  </body>
</html>
