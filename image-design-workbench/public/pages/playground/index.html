<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>自由生图 · AI 图像设计工作台</title>
    <link rel="stylesheet" href="/shared/theme.css" />
    <script src="/shared/theme-init.js"></script>
    <link rel="stylesheet" href="/pages/playground/playground.css" />
  </head>
  <body>
    <div id="page">
      <div class="pg-studio">
        <!-- 中间画布：提示词 + 结果 -->
        <div class="card pg-canvas">
          <div class="pg-canvas-head">
            <div>
              <div class="section-label">自由生图</div>
              <div class="card-title">文生图</div>
            </div>
            <span class="badge" id="canvasBadge">0 张结果</span>
          </div>
          <label class="field pg-prompt-field">
            <span>提示词</span>
            <textarea class="textarea" id="prompt" rows="3" placeholder="描述你想生成的图像：主体、构图、材质、光线、风格…"></textarea>
          </label>
          <div class="pg-stage" id="stage"></div>
        </div>

        <!-- 右侧：控制面板 -->
        <div class="card pg-panel">
          <div class="pg-panel-scroll">
            <div class="section-label">生成张数</div>
            <div class="pg-chips" id="counts"></div>

            <div class="section-label" style="margin-top: 18px">分辨率</div>
            <div class="pg-chips" id="resChips"></div>

            <div class="section-label" style="margin-top: 18px">输出比例</div>
            <div class="pg-chips" id="ratios"></div>
            <div class="pg-custom-size" id="customSize" hidden>
              <label class="pg-cs-field"><span>宽</span>
                <input class="input" id="customW" type="number" min="256" max="4096" step="1" value="1024" />
              </label>
              <span class="pg-cs-x">×</span>
              <label class="pg-cs-field"><span>高</span>
                <input class="input" id="customH" type="number" min="256" max="4096" step="1" value="1024" />
              </label>
              <span class="pg-cs-unit">px</span>
            </div>

            <label class="field" style="margin-top: 18px">
              <span>背景</span>
              <select class="select" id="background">
                <option value="">默认</option>
                <option value="auto">auto</option>
                <option value="transparent">transparent</option>
                <option value="opaque">opaque</option>
              </select>
            </label>

            <details class="pg-advanced">
              <summary>附加要求<span class="pg-adv-hint">（可选）</span></summary>
              <div class="pg-advanced-body">
                <textarea class="textarea" id="system" rows="2" placeholder="例如：严格保留主体结构，不添加文字"></textarea>
              </div>
            </details>
          </div>

          <div class="pg-panel-foot">
            <p class="msg" id="msg"></p>
            <button class="btn primary full" id="generateBtn" type="button">开始生成</button>
            <p class="card-desc" id="configHint" style="margin-top: 10px"></p>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/pages/playground/playground.js"></script>
  </body>
</html>
