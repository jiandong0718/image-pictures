server {
    listen 80 default_server;
    listen 18080;
    server_name _;

    client_max_body_size 25m;
    access_log /www/wwwlogs/image-design-workbench.access.log;
    error_log /www/wwwlogs/image-design-workbench.error.log;

    auth_basic "Image Design Workbench";
    auth_basic_user_file /www/server/nginx/conf/image-design-workbench.htpasswd;

    location / {
        proxy_pass http://127.0.0.1:4173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 240s;
        proxy_send_timeout 240s;
    }
}
